[package]
name = "susnotes-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "susnotes-core: local encrypted markdown knowledge base"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
hkdf = "0.13.0"
markdown = "1.0.0"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.26.0"
