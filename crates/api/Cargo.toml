[package]
name = "susnotes-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "susnotes-api: local encrypted markdown knowledge base"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
axum = "0.8.9"
futures-util = "0.3.34"
http = "1.5.0"
serde_json = "1.0.154"
susnotes-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
ureq = { version = "3.5.0", features = ["json"] }
percent-encoding = "2.3.2"

[dev-dependencies]
tempfile = "3.27.0"
ureq = "3.5.0"
